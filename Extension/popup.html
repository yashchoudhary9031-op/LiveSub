<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveSub Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-icon">🎬</span>
        <h1 class="logo-title">LiveSub</h1>
      </div>
      <div id="backendStatus" class="status-badge checking">Checking...</div>
    </header>

    <!-- Main Master Toggle -->
    <section class="section toggle-section">
      <label class="switch-container">
        <span class="label-text">Enable Subtitles</span>
        <input type="checkbox" id="enabledToggle">
        <span class="slider"></span>
      </label>
    </section>

    <!-- Controls Form -->
    <section class="section form-section">
      <!-- Target Language -->
      <div class="form-group">
        <label for="targetLang">Translate To</label>
        <select id="targetLang" class="form-select">
          <optgroup label="Popular Languages">
            <option value="hi" selected>Hindi (हिन्दी)</option>
            <option value="en">English (English)</option>
            <option value="es">Spanish (Español)</option>
            <option value="fr">French (Français)</option>
            <option value="de">German (Deutsch)</option>
            <option value="ja">Japanese (日本語)</option>
            <option value="ko">Korean (한국어)</option>
            <option value="zh-CN">Chinese (中文)</option>
            <option value="ru">Russian (Русский)</option>
            <option value="ar">Arabic (العربية)</option>
          </optgroup>
          <optgroup label="Indian Languages">
            <option value="bn">Bengali (বাংলা)</option>
            <option value="mr">Marathi (मराठी)</option>
            <option value="te">Telugu (తెలుగు)</option>
            <option value="ta">Tamil (தமிழ்)</option>
            <option value="gu">Gujarati (ગુજરાતી)</option>
            <option value="kn">Kannada (ಕನ್ನಡ)</option>
            <option value="ml">Malayalam (മലയാളം)</option>
            <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
            <option value="ur">Urdu (اردو)</option>
          </optgroup>
          <optgroup label="Other World Languages">
            <option value="pt">Portuguese (Português)</option>
            <option value="it">Italian (Italiano)</option>
            <option value="tr">Turkish (Türkçe)</option>
            <option value="vi">Vietnamese (Tiếng Việt)</option>
            <option value="id">Indonesian (Bahasa Indonesia)</option>
            <option value="nl">Dutch (Nederlands)</option>
            <option value="th">Thai (ไทย)</option>
          </optgroup>
        </select>
      </div>

      <!-- Spoken Language Hint -->
      <div class="form-group">
        <label for="langHint">Spoken Language (Hint)</label>
        <select id="langHint" class="form-select">
          <option value="" selected>Auto-Detect</option>
          <optgroup label="Major Languages">
            <option value="en">English</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="ru">Russian</option>
            <option value="ar">Arabic</option>
          </optgroup>
          <optgroup label="Indian Languages">
            <option value="bn">Bengali</option>
            <option value="mr">Marathi</option>
            <option value="te">Telugu</option>
            <option value="ta">Tamil</option>
            <option value="gu">Gujarati</option>
            <option value="kn">Kannada</option>
            <option value="ml">Malayalam</option>
            <option value="pa">Punjabi</option>
            <option value="ur">Urdu</option>
          </optgroup>
        </select>
      </div>

      <!-- Mode -->
      <div class="form-group">
        <label for="subMode">Mode</label>
        <select id="subMode" class="form-select">
          <option value="auto" selected>Auto (CC or Live Audio)</option>
          <option value="audio_stt">Live Audio STT (Groq Whisper)</option>
          <option value="caption_translate">Translate Existing Captions</option>
        </select>
      </div>

      <!-- Subtitle Size -->
      <div class="form-group">
        <label for="fontSize">Font Size</label>
        <select id="fontSize" class="form-select">
          <option value="18px">Small (18px)</option>
          <option value="22px" selected>Medium (22px)</option>
          <option value="28px">Large (28px)</option>
        </select>
      </div>
    </section>

    <section class="section export-section">
      <label for="exportFormat">Export translated subtitles</label>
      <div class="export-controls">
        <select id="exportFormat" class="form-select" aria-label="Subtitle file format">
          <option value="srt">SRT</option>
          <option value="txt">TXT</option>
        </select>
        <button id="exportButton" type="button">Export</button>
      </div>
      <div id="exportStatus" class="export-status" role="status" aria-live="polite"></div>
    </section>

    <!-- Footer Status -->
    <footer class="footer">
      <div id="footerStatus" class="footer-msg">Backend: http://localhost:8000</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
